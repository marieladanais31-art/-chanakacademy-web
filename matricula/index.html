<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Elige tu programa · Matrícula Chanak</title><meta name="robots" content="noindex,follow"/><style>body{font:17px system-ui;background:#f4f8fb;color:#0c2d48;max-width:720px;margin:50px auto;padding:24px}.card{background:white;border-radius:20px;padding:30px;box-shadow:0 8px 30px #0c2d4815}label{display:block;margin-top:20px;font-weight:600}select,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;margin-top:8px;border:1px solid #c8d8e3;border-radius:10px}button{background:#0c2d48;color:white;border:0;margin-top:24px;cursor:pointer}a{color:#168b98}.note{font-size:14px;color:#536575}</style></head><body><main class="card"><img src="/assets/dossiers/brand-logo.png" width="85" alt="Chanak"/><h1>Tu programa, tu matrícula</h1><p>Confirma país y programa. Después completarás los datos de la familia una sola vez en el SIS.</p><form id="enrollment-choice" action="https://sis.chanakacademy.org/matricula" method="GET"><label for="country">País / Country</label><select id="country" name="country" required><option value="">Seleccionar / Select</option><option value="ES">España</option><option value="MX">México</option><option value="PA">Panamá</option><option value="CO">Colombia</option><option value="US">Estados Unidos</option><option value="GLOBAL">Otro país / Other</option></select><label for="program">Programa / Program</label><select id="program" name="program" required><option value="">Seleccionar / Select</option><option value="off_campus">Off-Campus · Homeschool Guiado</option><option value="dual_diploma">Dual Diploma</option><option value="florida-heip" data-state="1">Florida · EMA / PEP · Apoyo educativo</option><option value="alabama-homeschool" data-state="1">Alabama · CHOOSE · Homeschool Guiado</option><option value="alabama-life-skills" data-state="1">Alabama · CHOOSE · Life Skills</option><option value="alabama-academic-assessment" data-state="1">Alabama · CHOOSE · Diagnóstico Académico</option><option value="alabama-tutoring" data-state="1">Alabama · CHOOSE · Tutorías</option></select><input type="hidden" name="currency" id="currency"/><input type="hidden" name="src" value="web-program-choice"/><button type="submit">Continuar al SIS / Continue to SIS</button></form><p class="note">Esta pantalla no solicita pagos ni confirma admisión. Las tarifas y condiciones corresponden al país y al programa elegidos.</p><p><a href="/#solicitud">Pedir información antes de matricularme</a></p></main><script>
(function(){
var qs=new URLSearchParams(location.search),country=document.getElementById('country'),program=document.getElementById('program'),currency=document.getElementById('currency');
var aliases={'off-campus':'off_campus','offcampus':'off_campus','dual-diploma':'dual_diploma','dual':'dual_diploma'};
var selected=qs.get('program')||qs.get('programa')||'';selected=aliases[selected]||selected;
var countries=['ES','MX','PA','CO','US','GLOBAL'], programs=['off_campus','dual_diploma','florida-heip','alabama-homeschool','alabama-life-skills','alabama-academic-assessment','alabama-tutoring'];
function update(){currency.value={ES:'EUR',MX:'MXN',PA:'USD',CO:'COP',US:'USD',GLOBAL:'USD'}[country.value]||'USD';program.querySelectorAll('[data-state]').forEach(function(o){o.disabled=country.value!=='US';o.hidden=country.value!=='US'});if(program.selectedOptions[0]&&program.selectedOptions[0].disabled)program.value='';}
country.value=countries.indexOf(qs.get('country'))>=0?qs.get('country'):'';
if(!country.value){var match=document.cookie.match(/(?:^|; )user_country=([^;]+)/);if(match&&countries.indexOf(decodeURIComponent(match[1]))>=0)country.value=decodeURIComponent(match[1]);}
if(/^florida-heip$|^alabama-/.test(selected))country.value='US';
update();country.addEventListener('change',update);
if(programs.indexOf(selected)>=0){var target=new URL('https://sis.chanakacademy.org/matricula');qs.forEach(function(v,k){target.searchParams.set(k,v)});target.searchParams.set('program',selected);if(country.value)target.searchParams.set('country',country.value);if(!target.searchParams.has('currency'))target.searchParams.set('currency',currency.value);location.replace(target.toString());}
document.getElementById('enrollment-choice').addEventListener('submit',function(){var funding=document.createElement('input');funding.type='hidden';funding.name='funding';funding.value=program.value==='florida-heip'?'scholarship':program.value.indexOf('alabama-')===0?'choose':'private';this.appendChild(funding);});
})();
</script></body></html>
